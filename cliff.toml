# git-cliff configuration for @zeldrisho/iconsur
#
# Versioning rules (single package, tag format v<version>):
#   breaking -> major, feat -> minor, fix/perf/revert -> patch;
#   docs/refactor/test/ci/chore appear in release notes but never bump.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

"""

body = """
{%- if version %}\n## [{{ version | trim_start_matches(pat="v") }}](https://github.com/zeldrisho/iconsur/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}\n{% else %}\n## [unreleased]\n{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} (`{{ commit.scope }}`){% endif %}
{%- endfor %}
{% endfor %}
"""

trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
commit_parsers = [
  { message = "^feat(?:\\([^)]*\\))?!?:", group = "Features" },
  { message = "^fix(?:\\([^)]*\\))?!?:", group = "Bug Fixes" },
  { message = "^perf(?:\\([^)]*\\))?!?:", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs(?:\\([^)]*\\))?!?:", group = "Documentation" },
  { message = "^refactor(?:\\([^)]*\\))?!?:", group = "Refactor" },
  { message = "^test(?:\\([^)]*\\))?!?:", group = "Testing" },
  { message = "^ci|^build(?:\\([^)]*\\))?!?:", group = "Build" },
  # Release commits (generated by this workflow) are excluded from the
  # changelog so regenerating it on a later release stays byte-identical.
  # Must precede the generic ^chore rule (first match wins).
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore(?:\\([^)]*\\))?!?:", group = "Chore" },
  { message = ".*", group = "Other" },
]
filter_commits = false
# Breaking changes are signalled by `!` or a BREAKING CHANGE footer.

[bump]
# docs/refactor/test/build/ci/chore commits never trigger a version bump.
# No commit_preprocessors here: they run before Conventional Commit parsing
# and would strip the `!` breaking-change marker (blocking major bumps).
no_increment_regex = "docs|refactor|test|build|ci|chore"
