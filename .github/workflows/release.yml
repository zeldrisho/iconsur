name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "24"

jobs:
  release:
    runs-on: macos-latest
    environment: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: true
      - name: Check tag and package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Validate
        run: |
          vp check
          vp test
      - name: Build macOS binaries
        run: vp run build
      - name: Publish package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if pnpm view "@zeldrisho/iconsur@${VERSION}" version >/dev/null 2>&1; then
            echo "${VERSION} is already published; continuing."
          else
            vp pm publish --access public --no-git-checks
          fi
      - name: Create GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.ts "$VERSION" > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" dist/iconsur-arm64 dist/iconsur-x64 \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/iconsur-arm64 dist/iconsur-x64 \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
