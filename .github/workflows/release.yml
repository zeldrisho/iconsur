name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Compute next version
        id: versions
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          NEXT_VERSION="$(git-cliff --config cliff.toml --bumped-version 2>/dev/null | tail -n 1)"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip docs-only / chore-only pushes
        if: steps.versions.outputs.next_version == steps.versions.outputs.last_tag || steps.versions.outputs.next_version == ''
        run: echo "No releasable commits since ${{ steps.versions.outputs.last_tag }}; skipping release."
      - name: Update version and changelog
        if: steps.versions.outputs.next_version != steps.versions.outputs.last_tag
        run: |
          git-cliff --config cliff.toml --tag "v${{ steps.versions.outputs.next_version }}" -o CHANGELOG.md
          npm version "${{ steps.versions.outputs.next_version }}" --no-git-tag-version
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.versions.outputs.next_version }}"
          git tag "v${{ steps.versions.outputs.next_version }}"
          git push origin main --tags
      - name: Build binaries (x64 + arm64)
        if: steps.versions.outputs.next_version != steps.versions.outputs.last_tag
        run: pnpm run build
      - name: Publish to npm
        if: steps.versions.outputs.next_version != steps.versions.outputs.last_tag
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - name: Create GitHub release
        if: steps.versions.outputs.next_version != steps.versions.outputs.last_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.next_version }}
          body_path: CHANGELOG.md
          files: |
            dist/iconsur-arm64
            dist/iconsur-x64
