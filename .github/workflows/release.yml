name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # Required for npm Trusted Publishing (OIDC)
  pull-requests: write # Required for gh pr create/merge in the release-commit step

# No NPM_AUTH_TOKEN secret is needed: the publish step below authenticates
# via the trusted publisher configured for @zeldrisho/iconsur on npmjs.com.

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment claim of the npm trusted publisher for
    # @zeldrisho/iconsur (configured with `npm trust github`). GitHub
    # auto-creates this environment on first run; add protection rules
    # here if you want a manual approval gate before publishing.
    environment: publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Vite+ (vp)
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true
          run-install: true
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Compute next version and release state
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Highest version tag, reachable or not: `git describe` breaks when
          # the only tag points at a commit that is not on this branch yet
          # (e.g. the release commit of an interrupted run).
          LAST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)"
          LAST_TAG="${LAST_TAG:-v0.0.0}"
          # --use-branch-tags: only consider tags on this branch so an
          # unreachable tag (interrupted release) can never skew the bump.
          NEXT_VERSION="$(vp exec git-cliff --config cliff.toml --bumped-version --use-branch-tags 2>/dev/null | tail -n 1)"
          # Versions are stored without the "v" prefix; tags are built as "v${VERSION}".
          LAST_TAG="${LAST_TAG#v}"
          NEXT_VERSION="${NEXT_VERSION#v}"
          RELEASE_VERSION=""
          if [ -n "$NEXT_VERSION" ] && [ "$NEXT_VERSION" != "$LAST_TAG" ]; then
            # New conventional commits since the latest tag.
            RELEASE_VERSION="$NEXT_VERSION"
          elif [ "$LAST_TAG" != "0.0.0" ]; then
            # No new commits: the latest tag may still be an incomplete
            # release (e.g. a previous run failed after pushing it).
            NPM_PUBLISHED="false"
            GH_RELEASED="false"
            vp exec pnpm view "@zeldrisho/iconsur@${LAST_TAG}" version >/dev/null 2>&1 && NPM_PUBLISHED="true"
            gh release view "v${LAST_TAG}" >/dev/null 2>&1 && GH_RELEASED="true"
            if [ "$NPM_PUBLISHED" != "true" ] || [ "$GH_RELEASED" != "true" ]; then
              RELEASE_VERSION="$LAST_TAG"
            fi
          fi
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip when there is nothing to release
        if: steps.versions.outputs.release_version == ''
        run: |
          echo "No releasable commits since v${LAST_TAG} and the latest version is already published; skipping release."
        env:
          LAST_TAG: ${{ steps.versions.outputs.last_tag }}
      - name: Update version and changelog
        # Runs for fresh and resumed releases alike: every action below is
        # idempotent (skip commit if unchanged, skip tag if it exists).
        if: steps.versions.outputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          set -euo pipefail
          vp exec git-cliff --config cliff.toml --tag "v${RELEASE_VERSION}" -o CHANGELOG.md
          # pnpm's native version command (no npm CLI delegation, so npm's
          # devEngines EBADDEVENGINES check never runs). --no-git-checks:
          # git-cliff just dirtied the working tree above; we create the
          # commit and tag ourselves in this step. --allow-same-version:
          # a resumed run may already have the bumped manifest.
          vp exec pnpm version "$RELEASE_VERSION" --no-git-tag-version --no-git-checks --allow-same-version
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Version and changelog already committed by a prior run; not creating a duplicate commit."
          else
            git commit -m "chore(release): v${RELEASE_VERSION}"
          fi
          if ! git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            git tag "v${RELEASE_VERSION}"
          else
            # Tag exists: verify it resolves to the current release commit
            # or to a commit already on this branch (a fully merged release
            # being resumed after a failed publish). An orphaned tag from an
            # interrupted run must not be silently reused while a different
            # commit gets merged to main.
            TAG_COMMIT="$(git rev-parse "refs/tags/v${RELEASE_VERSION}^{commit}")"
            if git merge-base --is-ancestor "$TAG_COMMIT" HEAD 2>/dev/null; then
              echo "Tag v${RELEASE_VERSION} already exists and resolves to a commit on this branch; reusing it."
            else
              echo "::error::Tag v${RELEASE_VERSION} exists but points to ${TAG_COMMIT}, a commit not on this branch. This is likely an orphaned tag from an interrupted run; delete the tag (git push origin :refs/tags/v${RELEASE_VERSION}) and re-run the workflow."
              exit 1
            fi
          fi
          # Only the tag is pushed here. The release commit itself lands on
          # main through the "Merge release commit to main" step below,
          # because the Protect ruleset requires changes to go via a PR.
          git push origin "refs/tags/v${RELEASE_VERSION}"
      - name: Merge release commit to main
        # The Protect ruleset on main forbids direct pushes, so the release
        # commit (package.json + CHANGELOG.md) is merged through a PR that
        # this step opens, waits for CI on, and merges. This runs before
        # publishing so npm and the GitHub release are only exposed once main
        # actually contains the version/changelog commit.
        if: steps.versions.outputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            echo "Release commit is already on main; no PR needed."
            exit 0
          fi
          BRANCH="release/v${RELEASE_VERSION}"
          # Force-push: an interrupted prior run may have left this branch
          # (and an attached PR) behind with an equivalent but different SHA.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          PR_URL="$(gh pr create --base main --head "${BRANCH}" \
            --title "chore(release): v${RELEASE_VERSION}" \
            --body "Automated release commit: bump package.json to v${RELEASE_VERSION} and regenerate CHANGELOG.md." \
            2>/dev/null | tail -n 1 || true)"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr view "${BRANCH}" --json url --jq .url 2>/dev/null || true)"
          fi
          if [ -z "$PR_URL" ]; then
            # Fail loudly: a later run cannot retry the missing merge, because
            # it would see the pushed tag / published state as "complete".
            echo "::error::Could not create or find release PR ${BRANCH}; the release commit will not reach main. Fix the branch/PR and re-run the workflow."
            exit 1
          fi
          # Auto-merge is disabled on this repo, so wait for the required CI
          # check to pass and merge explicitly.
          for i in $(seq 1 60); do
            STATE="$(gh pr view "$PR_URL" --json statusCheckRollup --jq \
              '[.statusCheckRollup[]? | select(.name == "Check, test, and build") | .conclusion] | .[0] // "PENDING"' 2>/dev/null || true)"
            case "$STATE" in
              SUCCESS)
                gh pr merge "$PR_URL" --merge --delete-branch
                exit 0
                ;;
              FAILURE|ERROR|CANCELLED)
                echo "::error::CI check on release PR failed: ${STATE}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for CI on the release PR"
          exit 1
      - name: Publish to npm (trusted publishing / OIDC)
        if: steps.versions.outputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        # No NODE_AUTH_TOKEN here: setting it would make the package manager
        # use the legacy token path instead of the OIDC trusted publisher.
        # pnpm 11's native publish detects the GitHub Actions OIDC environment
        # and exchanges an id-token for npm credentials automatically
        # (audience npm:registry.npmjs.org), same as the npm CLI.
        run: |
          set -euo pipefail
          if vp exec pnpm view "@zeldrisho/iconsur@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "v${RELEASE_VERSION} is already published to npm; skipping."
          else
            vp exec pnpm publish --access public --no-git-checks
          fi
      - name: Build binaries (macOS arm64 + x64)
        # Runs after publish: the pnpm pack triggered by publish runs the
        # prepack script (`vp pack --no-clean` + mask.png) to rebuild
        # dist/index.cjs for the npm tarball, so this build must come later
        # to keep the pkg binaries out of the tarball and fresh for the
        # GitHub release below.
        if: steps.versions.outputs.release_version != ''
        run: vp run build
      - name: Create GitHub release
        if: steps.versions.outputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${RELEASE_VERSION} already exists; skipping."
          else
            gh release create "v${RELEASE_VERSION}" dist/iconsur-arm64 dist/iconsur-x64 \
              --notes-file CHANGELOG.md
          fi
