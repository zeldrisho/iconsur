name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Vite+ (vp)
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true
          run-install: true
      - name: Format, lint, and type-check
        run: vp check
      - name: Tests
        run: vp test
      - name: Build binaries (macOS arm64 + x64)
        run: vp run build
